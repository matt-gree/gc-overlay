<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GC Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 100%; height: 100%; }

body {
  overflow: hidden;
  background: #1a1a2e;
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
body.transparent-bg { background: transparent; }

/* The SVG scales to whatever size OBS gives the browser source, so the
   recommended 512x180 is a ratio rather than a fixed size. */
#overlay { position: relative; width: 100%; height: 100%; }
#controller-svg { display: block; width: 100%; height: 100%; }

.hidden { display: none; }

/* ── SVG Styles ── */

/* Keyline (the .halo <use> below the controller group)
   Every stroke is drawn twice: once by the halo layer in black and a few px
   wider, once by the real element on top. That black ring is what keeps the
   overlay readable over a bright capture — a thin grey outline on a green
   field has almost no luminance separation and vanishes when the source is
   scaled down into a stream layout.

   The halo layer sits entirely *behind* the controller, so halos may overlap
   each other freely; no halo can ever cover a real shape. Every stroked rule
   below therefore reads its paint through --halo-c / --halo-w, whose
   defaults (the element's own colour, no extra width) are what the real copy
   draws with. Text carries its own keyline via paint-order instead, so the
   status line — which is outside the halo group — gets one too.

   Black is fully opaque, like everything else here. See the No Alpha rule. */
.halo { --halo-c: #000000; --halo-w: 4px; pointer-events: none; }

/* Gates */
.gate {
  fill: var(--idle-neutral, none); stroke: var(--halo-c, #C8C8C8); stroke-linejoin: round;
  stroke-width: calc(4px + var(--halo-w, 0px));
}
.gate-c {
  fill: var(--idle-gold, none); stroke: var(--halo-c, #D4A017); stroke-linejoin: round;
  stroke-width: calc(4px + var(--halo-w, 0px));
}

/* Stick heads */
/* Stick heads — the one keyline that is NOT drawn by the halo layer. A head
   sits over its gate, so its ring has to sit over the gate line too; from
   behind, the gate's own stroke cuts across it. The heads come after the
   gates in document order, so painting the ring here puts it on top. */
.stick-head {
  fill: #FFFFFF; stroke: var(--head-ring, #000000);
  stroke-width: var(--head-ring-w, 4px);
}
.stick-head-c {
  fill: #FFD43B; stroke: var(--head-ring-c, #000000);
  stroke-width: var(--head-ring-w, 4px);
}

/* Triggers */
.trigger-outline {
  fill: var(--idle-neutral, none); stroke: var(--halo-c, #C8C8C8);
  stroke-width: calc(3.5px + var(--halo-w, 0px));
}
.trigger-fill { fill: #FFFFFF; }
.trigger-label {
  display: var(--label-display, inline);
  fill: #BBBBBB;
  font-size: 16px;
  font-weight: 700;
  font-family: -apple-system, sans-serif;
  text-anchor: middle;
  dominant-baseline: central;
}

/* Buttons — A */
.grp-a .shape {
  fill: var(--idle-a, none); stroke: var(--halo-c, #00E196);
  stroke-width: calc(4px + var(--halo-w, 0px));
}
.grp-a.pressed .shape { fill: #00E196; }
.grp-a .label { fill: #00E196; }
.grp-a.pressed .label { fill: #10241d; }

/* Buttons — B */
.grp-b .shape {
  fill: var(--idle-b, none); stroke: var(--halo-c, #E63E3E);
  stroke-width: calc(4px + var(--halo-w, 0px));
}
.grp-b.pressed .shape { fill: #E63E3E; }
.grp-b .label { fill: #E63E3E; }
.grp-b.pressed .label { fill: #2a1010; }

/* Buttons — X / Y beans */
.grp-x .shape, .grp-y .shape {
  fill: var(--idle-neutral, none); stroke: var(--halo-c, #C8C8C8); stroke-linejoin: round;
  stroke-width: calc(4px + var(--halo-w, 0px));
}
.grp-x.pressed .shape, .grp-y.pressed .shape {
  fill: #FFFFFF; stroke: var(--halo-c, #FFFFFF);
}
.grp-x .label, .grp-y .label { fill: #C8C8C8; }
.grp-x.pressed .label, .grp-y.pressed .label { fill: #202020; }

/* Buttons — Z */
.grp-z .shape {
  fill: var(--idle-z, none); stroke: var(--halo-c, #B36CD6);
  stroke-width: calc(4px + var(--halo-w, 0px));
}
.grp-z.pressed .shape { fill: #B36CD6; }
.grp-z .label { fill: #B36CD6; }
.grp-z.pressed .label { fill: #201029; }

/* Buttons — Start */
.grp-start .shape {
  fill: var(--idle-neutral, none); stroke: var(--halo-c, #C8C8C8);
  stroke-width: calc(3.5px + var(--halo-w, 0px));
}
.grp-start.pressed .shape { fill: #FFFFFF; stroke: var(--halo-c, #FFFFFF); }
.grp-start .label { fill: #C8C8C8; stroke-width: 1.5px; }  /* ST is small — a full keyline swallows the button */
.grp-start.pressed .label { fill: #1a1a2e; }

/* D-pad — arms fill on press, a single plus outline sits on top so the
   cross reads as one shape instead of five stroked boxes. */
.dpad-arm { fill: var(--idle-neutral, none); stroke: none; }
.dpad-arm.pressed { fill: #FFFFFF; }
.dpad-outline {
  fill: none;  /* sits over the arms — a fill here would hide them */
  stroke: var(--halo-c, #C8C8C8);
  stroke-width: calc(4px + var(--halo-w, 0px));
  stroke-linejoin: round;
}

/* Button labels — glyphs carry their own black keyline. paint-order puts the
   stroke behind the fill, so the letter keeps its full weight and the ring
   grows outward only. */
.btn-label, .arc-label, .trigger-label, .port-label,
.status-main, .status-sub {
  stroke: #000000;
  stroke-linejoin: round;
  paint-order: stroke;
}
.btn-label {
  display: var(--label-display, inline);
  font-family: -apple-system, sans-serif;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  stroke-width: 3px;
}
.arc-label {
  display: var(--label-display, inline);
  font-family: -apple-system, sans-serif;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  stroke-width: 2.5px;
}
.trigger-label { stroke-width: 2.5px; }

/* …except while the button is held. A pressed label is a very dark tint of its
   own hue sitting on an opaque bright fill — it already has all the contrast
   it needs, and a black ring around a dark glyph only thickens it into a blob.
   This selector lives entirely inside the halo's shadow tree, so it clears the
   clone's stroke too; otherwise the wider clone would still ring the letter
   from behind. The trigger glyphs are deliberately not covered: they sit on a
   white bar at full press and the keyline is what keeps them readable. */
.pressed .label { stroke: none; }

/* Letters off — see the show_labels setting.
   This has to travel as an *inherited* property rather than a descendant
   selector: the halo <use> renders a shadow tree, and a selector rooted
   outside it (#controller-svg …) does not match the cloned glyphs, so the
   halo copies would keep drawing letters after the real ones went away.
   Rules that live entirely inside the tree (.gate, .grp-a .shape, .pressed)
   match fine — only the boundary-crossing ones need this treatment. */
#controller-svg.no-labels { --label-display: none; }

/* Port indicator */
.port-label {
  fill: #C8C8C8;
  font-size: 13px;
  font-weight: 600;
  font-family: -apple-system, sans-serif;
  text-anchor: end;
  stroke-width: 2.5px;
}

/* Status text (inside the SVG so it scales with everything else) */
.status-main {
  fill: #C8C8C8;
  font-size: 14px;
  font-family: -apple-system, sans-serif;
  text-anchor: middle;
  stroke-width: 2.5px;
}
.status-sub {
  fill: #999999;
  font-size: 11px;
  font-family: -apple-system, sans-serif;
  text-anchor: middle;
  stroke-width: 2px;
}


/* ── Toggles that have to cross the halo's shadow boundary ── */

/* Idle fill — a dark plate inside every unpressed shape, so a button reads as
   a filled chip rather than a hollow ring. Off by default: it is a large
   visual change, and the hollow look is what PRSH already ships.

   Like --label-display, these travel as *inherited* custom properties rather
   than descendant selectors, because #controller-svg is outside the halo
   <use>'s shadow tree. The halo's clones pick the fills up too, but they are
   covered exactly by the real shapes, so it costs nothing.

   Tints of each button's own hue rather than one flat grey — dark enough to
   read as unlit next to the pressed colour, warm enough to keep the button's
   identity when the letters are off. */
#controller-svg.idle-fill {
  --idle-neutral: #1E1E24;
  --idle-a: #0D2B22;
  --idle-b: #2E1414;
  --idle-z: #241436;
  --idle-gold: #2B2209;
}

/* Keyline off — dropping the whole halo layer takes every cloned stroke with
   it, so this one *can* be a plain selector: .halo is a light-DOM child. The
   glyph keylines are drawn by the real elements (see paint-order above), so
   they have to be cleared separately. */
#controller-svg.no-keyline .halo { display: none; }
#controller-svg.no-keyline .btn-label,
#controller-svg.no-keyline .arc-label,
#controller-svg.no-keyline .trigger-label,
#controller-svg.no-keyline .port-label,
#controller-svg.no-keyline .status-main,
#controller-svg.no-keyline .status-sub { stroke: none; }
#controller-svg.no-keyline {
  --head-ring: #444444;
  --head-ring-c: #8A7009;
  --head-ring-w: 2.5px;
}

/* ── Settings Panel ── */
#settings-toggle {
  position: absolute;
  bottom: 6px;
  left: 6px;
  width: 22px;
  height: 22px;
  border: none;
  background: none;
  color: #555555;
  font-size: 15px;
  cursor: pointer;
  z-index: 200;
  border-radius: 4px;
  display: none;
  align-items: center;
  justify-content: center;
}
#settings-toggle.visible { display: flex; }
#settings-toggle:hover { color: #AAAAAA; }

#settings {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #13132a;
  z-index: 150;
  padding: 14px 18px;
  color: #CCCCCC;
  font-size: 13px;
  overflow: auto;
}
#settings.visible { display: flex; flex-direction: column; gap: 9px; }
#settings h3 { font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 2px; }
.setting-row { display: flex; align-items: center; gap: 10px; }
.setting-row label { min-width: 84px; }
.setting-row select, .setting-row button {
  padding: 3px 10px;
  border: 1px solid #444444;
  border-radius: 4px;
  background: #222244;
  color: #FFFFFF;
  font-size: 13px;
  cursor: pointer;
}
.setting-row button:hover { background: #333366; }
.setting-row input[type=checkbox] { cursor: pointer; }
.settings-foot { margin-top: auto; color: #555555; font-size: 11px; }
</style>
</head>
<body>

<div id="overlay">

  <svg id="controller-svg" viewBox="0 0 512 180" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="clip-tl"><rect x="30" y="9" width="124" height="24" rx="3"/></clipPath>
      <clipPath id="clip-tr"><rect x="290" y="9" width="124" height="24" rx="3"/></clipPath>
    </defs>

    <!-- ── Status ── -->
    <g id="status-group">
      <text class="status-main" id="status-main" x="256" y="82">Waiting for controller data...</text>
      <text class="status-sub" id="status-sub" x="256" y="104">Start the overlay before launching Dolphin</text>
    </g>

    <!-- ── Controller ── -->
    <!-- Keyline layer: the whole controller redrawn behind itself in black,
         a few px wider. See the .halo CSS above. It inherits the controller's
         own pressed/hidden state because it is the same DOM. -->
    <use class="halo" href="#controller-group"/>
    <g id="controller-group" class="hidden">

      <!-- L Trigger -->
      <rect class="trigger-outline" x="27" y="6" width="130" height="30" rx="6"/>
      <rect class="trigger-fill" id="tl-fill" clip-path="url(#clip-tl)" x="30" y="9" width="0" height="24"/>
      <text class="trigger-label" x="92" y="21">L</text>

      <!-- R Trigger — bumped left so Z can take the top-right corner -->
      <rect class="trigger-outline" x="287" y="6" width="130" height="30" rx="6"/>
      <rect class="trigger-fill" id="tr-fill" clip-path="url(#clip-tr)" x="414" y="9" width="0" height="24"/>
      <text class="trigger-label" x="352" y="21">R</text>

      <!-- Main Stick — regular octagon, center (84,100), circumradius 54.
           Vertices sit on the cardinals and diagonals, matching the notches
           of a real GC gate. -->
      <polygon class="gate"
        points="138,100 122.2,138.2 84,154 45.8,138.2 30,100 45.8,61.8 84,46 122.2,61.8"/>
      <circle class="stick-head" id="main-stick" cx="84" cy="100" r="29"/>

      <!-- C-Stick — regular octagon, center (240,100), circumradius 38, same
           notch orientation as the main gate and on the same centerline. The
           gates taper as they descend, so the wedge below and between them
           still clears the D-pad. -->
      <polygon class="gate-c"
        points="278,100 266.9,126.9 240,138 213.1,126.9 202,100 213.1,73.1 240,62 266.9,73.1"/>
      <circle class="stick-head-c" id="c-stick" cx="240" cy="100" r="20"/>

      <!-- D-Pad — center (170,138), 18px arms, tucked into the diagonal gap
           below and between the two gates so it costs no extra height.
           The grey outline is a plain square-cornered plus. Each arm's fill
           is the whole arm plus a 45° point into the middle, so a held
           direction reads as an arrow aimed at the centre; the four points
           meet exactly at (170,138) and tile the centre square. -->
      <polygon class="dpad-arm" id="dpad-up"
        points="161,110 179,110 179,129 170,138 161,129"/>
      <polygon class="dpad-arm" id="dpad-down"
        points="161,166 179,166 179,147 170,138 161,147"/>
      <polygon class="dpad-arm" id="dpad-left"
        points="142,129 142,147 161,147 170,138 161,129"/>
      <polygon class="dpad-arm" id="dpad-right"
        points="198,129 198,147 179,147 170,138 179,129"/>
      <path class="dpad-outline"
        d="M 161 110 L 179 110 L 179 129 L 198 129 L 198 147 L 179 147
           L 179 166 L 161 166 L 161 147 L 142 147 L 142 129 L 161 129 Z"/>

      <!-- Y Button — bean above A, centered on A(398,126), centreline radius
           62, half-thickness 16, spanning -128° to -88°. Outlined rather than
           drawn as a thick stroke so it fills on press like A/B/Z/Start. -->
      <g class="grp-y" id="grp-y">
        <path class="shape" d="M 349.98 64.54
          A 78 78 0 0 1 400.72 48.05
          A 16 16 0 0 1 399.61 80.03
          A 46 46 0 0 0 369.68 89.75
          A 16 16 0 0 1 349.98 64.54 Z"/>
        <text class="arc-label label" x="378.8" y="67.0" font-size="17">Y</text>
      </g>

      <!-- X Button — bean right of A, same construction as Y, spanning
           -30° to 10° so it straddles A's centerline. -->
      <g class="grp-x" id="grp-x">
        <path class="shape" d="M 465.55 87.0
          A 78 78 0 0 1 474.82 139.54
          A 16 16 0 0 1 443.3 133.99
          A 46 46 0 0 0 437.84 103.0
          A 16 16 0 0 1 465.55 87.0 Z"/>
        <text class="arc-label label" x="458" y="115.2" font-size="17">X</text>
      </g>

      <!-- A Button -->
      <g class="grp-a" id="grp-a">
        <circle class="shape" cx="398" cy="126" r="34"/>
        <text class="btn-label label" x="398" y="126" font-size="24">A</text>
      </g>

      <!-- B Button -->
      <g class="grp-b" id="grp-b">
        <circle class="shape" cx="334" cy="148" r="21"/>
        <text class="btn-label label" x="334" y="148" font-size="17">B</text>
      </g>

      <!-- Z Button — top-right corner, sharing the trigger row. Moving it
           out of the A cluster is what frees X to grow upward. -->
      <g class="grp-z" id="grp-z">
        <rect class="shape" x="429" y="6" width="56" height="30" rx="15"/>
        <text class="btn-label label" x="457" y="21" font-size="17">Z</text>
      </g>

      <!-- Start Button -->
      <g class="grp-start" id="grp-start">
        <circle class="shape" cx="302" cy="112" r="14"/>
        <text class="btn-label label" x="302" y="112" font-size="11">ST</text>
      </g>

      <!-- Port Indicator -->
      <text class="port-label" id="port-label" x="502" y="172">P1</text>
    </g>
  </svg>

  <!-- Settings Toggle -->
  <button id="settings-toggle" title="Settings">&#9881;</button>

  <!-- Settings Panel -->
  <div id="settings">
    <h3>GC Overlay Settings</h3>
    <div class="setting-row">
      <label>Port:</label>
      <select id="port-select">
        <option value="1">Port 1</option>
        <option value="2">Port 2</option>
        <option value="3">Port 3</option>
        <option value="4">Port 4</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Background:</label>
      <select id="bg-select">
        <option value="dark">Dark</option>
        <option value="transparent">Transparent (OBS)</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Port label:</label>
      <input type="checkbox" id="port-label-check">
    </div>
    <div class="setting-row">
      <label>Status text:</label>
      <input type="checkbox" id="status-check">
    </div>
    <div class="setting-row">
      <label>Letters:</label>
      <input type="checkbox" id="labels-check">
    </div>
    <div class="setting-row">
      <label>Keyline:</label>
      <input type="checkbox" id="keyline-check">
    </div>
    <div class="setting-row">
      <label>Idle fill:</label>
      <input type="checkbox" id="idle-fill-check">
    </div>
    <div class="setting-row">
      <label></label>
      <button id="calibrate-btn">Calibrate Sticks</button>
    </div>
    <div class="setting-row settings-foot">GC Overlay</div>
  </div>

</div>

<script>
(function() {
  'use strict';

  const $ = id => document.getElementById(id);

  const svgEl = $('controller-svg');
  const statusGroup = $('status-group');
  const statusMain = $('status-main');
  const statusSub = $('status-sub');
  const controllerGroup = $('controller-group');
  const settingsPanel = $('settings');
  const settingsToggle = $('settings-toggle');
  const portSelect = $('port-select');
  const bgSelect = $('bg-select');
  const portLabelCheck = $('port-label-check');
  const statusCheck = $('status-check');
  const labelsCheck = $('labels-check');
  const keylineCheck = $('keyline-check');
  const idleFillCheck = $('idle-fill-check');
  const calibrateBtn = $('calibrate-btn');

  // Sticks — travel splits the difference between the gate's notches
  // (circumradius) and its flats (apothem), so a full deflection reads as
  // hitting the notch without the head breaking the gate line mid-edge.
  const mainStick = $('main-stick');
  const cStick = $('c-stick');
  const MAIN_STICK_CENTER = { x: 84, y: 100 };
  const C_STICK_CENTER = { x: 240, y: 100 };
  const MAIN_STICK_RANGE = 23;
  const C_STICK_RANGE = 16;

  // Triggers
  const tlFill = $('tl-fill');
  const trFill = $('tr-fill');
  const TRIGGER_WIDTH = 124;
  const TRIGGER_R_RIGHT = 414;

  // Button groups
  const grpA = $('grp-a');
  const grpB = $('grp-b');
  const grpX = $('grp-x');
  const grpY = $('grp-y');
  const grpZ = $('grp-z');
  const grpStart = $('grp-start');

  // D-pad
  const dpadUp = $('dpad-up');
  const dpadDown = $('dpad-down');
  const dpadLeft = $('dpad-left');
  const dpadRight = $('dpad-right');

  // Port
  const portLabel = $('port-label');

  // ── Settings ──
  // The server owns settings: it merges its defaults with this page's query
  // string and sends the result down the socket. The gear starts hidden so a
  // gear-less source never flashes one before the first settings message.
  const cfg = {
    port: 1,
    background: 'dark',
    show_gear: false,
    show_port_label: true,
    show_status: true,
    show_labels: true
  };

  // Apply the background from the URL immediately, so an OBS source started
  // with ?bg=transparent never paints a dark frame before the socket opens.
  const params = new URLSearchParams(location.search);
  const bgParam = params.get('bg') || params.get('background');
  if (bgParam === 'transparent') document.body.classList.add('transparent-bg');

  let settingsOpen = false;

  function applySettings(patch) {
    Object.assign(cfg, patch);

    document.body.classList.toggle('transparent-bg', cfg.background === 'transparent');
    settingsToggle.classList.toggle('visible', !!cfg.show_gear);
    portLabel.classList.toggle('hidden', !cfg.show_port_label);
    svgEl.classList.toggle('no-labels', !cfg.show_labels);
    svgEl.classList.toggle('no-keyline', !cfg.show_keyline);
    svgEl.classList.toggle('idle-fill', !!cfg.show_idle_fill);
    portLabel.textContent = 'P' + cfg.port;

    // Keep the panel controls in sync with whatever drove the change.
    portSelect.value = String(cfg.port);
    bgSelect.value = cfg.background;
    portLabelCheck.checked = !!cfg.show_port_label;
    statusCheck.checked = !!cfg.show_status;
    labelsCheck.checked = !!cfg.show_labels;
    keylineCheck.checked = !!cfg.show_keyline;
    idleFillCheck.checked = !!cfg.show_idle_fill;

    if (!cfg.show_gear && settingsOpen) {
      settingsOpen = false;
      settingsPanel.classList.remove('visible');
    }
  }

  // A local change: tell the server so it tracks this client, but it stays
  // scoped to this browser source and does not move the server defaults.
  function setLocal(patch) {
    applySettings(patch);
    sendMessage({ settings: patch });
  }

  settingsToggle.addEventListener('click', () => {
    settingsOpen = !settingsOpen;
    settingsPanel.classList.toggle('visible', settingsOpen);
  });

  portSelect.addEventListener('change', () => {
    setLocal({ port: parseInt(portSelect.value, 10) });
  });

  bgSelect.addEventListener('change', () => {
    setLocal({ background: bgSelect.value });
  });

  portLabelCheck.addEventListener('change', () => {
    setLocal({ show_port_label: portLabelCheck.checked });
  });

  statusCheck.addEventListener('change', () => {
    setLocal({ show_status: statusCheck.checked });
  });

  keylineCheck.addEventListener('change', () => {
    setLocal({ show_keyline: keylineCheck.checked });
  });

  idleFillCheck.addEventListener('change', () => {
    setLocal({ show_idle_fill: idleFillCheck.checked });
  });

  labelsCheck.addEventListener('change', () => {
    setLocal({ show_labels: labelsCheck.checked });
  });

  calibrateBtn.addEventListener('click', () => {
    sendMessage({ calibrate: true });
  });

  // ── WebSocket ──
  let ws = null;
  let reconnectTimer = null;

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    // Forward this page's query string so the server can resolve the
    // effective settings for this source in one place.
    ws = new WebSocket(protocol + '//' + location.host + '/ws' + location.search);

    ws.onopen = () => {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); }
      catch (e) { return; }
      if (msg.type === 'settings') applySettings(msg.settings || {});
      else updateOverlay(msg);
    };

    ws.onclose = () => { ws = null; reconnectTimer = setTimeout(connect, 1000); };
    ws.onerror = () => { if (ws) ws.close(); };
  }

  function sendMessage(data) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
  }

  // ── Update Overlay ──
  function toggle(el, cls, on) {
    el.classList.toggle(cls, !!on);
  }

  function updateOverlay(state) {
    if (settingsOpen) return;

    const show = state.adapter_connected && state.connected;
    toggle(controllerGroup, 'hidden', !show);
    toggle(statusGroup, 'hidden', show || !cfg.show_status);

    if (!show) {
      if (!state.adapter_connected) {
        statusMain.textContent = 'Waiting for controller data...';
        statusSub.textContent = 'Start the overlay before launching Dolphin';
      } else {
        statusMain.textContent = 'No controller on Port ' + state.port;
        statusSub.textContent = 'Plug in a controller';
      }
      return;
    }

    const b = state.buttons;

    // Buttons
    toggle(grpA, 'pressed', b.a);
    toggle(grpB, 'pressed', b.b);
    toggle(grpX, 'pressed', b.x);
    toggle(grpY, 'pressed', b.y);
    toggle(grpZ, 'pressed', b.z);
    toggle(grpStart, 'pressed', b.start);

    // Triggers — analog fill, or the whole bar once the trigger clicks.
    // The digital press bottoms the bar out rather than showing a separate
    // marker; a real trigger is fully depressed when the click fires.
    tlFill.setAttribute('width', TRIGGER_WIDTH * (b.l ? 1 : state.trigger_l));
    const rw = TRIGGER_WIDTH * (b.r ? 1 : state.trigger_r);
    trFill.setAttribute('x', TRIGGER_R_RIGHT - rw);
    trFill.setAttribute('width', rw);

    // Sticks
    mainStick.setAttribute('cx', MAIN_STICK_CENTER.x + state.stick.x * MAIN_STICK_RANGE);
    mainStick.setAttribute('cy', MAIN_STICK_CENTER.y - state.stick.y * MAIN_STICK_RANGE);
    cStick.setAttribute('cx', C_STICK_CENTER.x + state.cstick.x * C_STICK_RANGE);
    cStick.setAttribute('cy', C_STICK_CENTER.y - state.cstick.y * C_STICK_RANGE);

    // D-pad
    toggle(dpadUp, 'pressed', b.dpad_up);
    toggle(dpadDown, 'pressed', b.dpad_down);
    toggle(dpadLeft, 'pressed', b.dpad_left);
    toggle(dpadRight, 'pressed', b.dpad_right);
  }

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '4') setLocal({ port: parseInt(e.key, 10) });
    if (e.key === 'c') sendMessage({ calibrate: true });
  });

  // ── Start ──
  applySettings({});
  connect();
})();
</script>
